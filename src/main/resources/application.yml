spring:
  application:
    name: payment-processing-api

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: payment_user
    password: payment_password

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password: payment_password

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

info:
  app:
    name: payment-processing-api
    description: Demonstration payment processing API
logging:
  level:
    com.example.paymentprocessingapi: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN